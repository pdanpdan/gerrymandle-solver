name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub's scheduler can create runs hours late, so a sparse cron leaves
    # the site without the new daily puzzle until the next slot. Frequent
    # builds are cheap: postbuild reuses the deployed puzzles.json and only
    # fetches new or missing days from the API.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Base for the incremental postbuild fetch: reuse the live site's
      # puzzles.json and only ask the API for new or missing days.
      PUZZLES_BASE_URL: https://pdanpdan.github.io/gerrymandle-solver/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
